<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <title>Task 2</title>

    <style>
        :root {
            --page-bg-color: #F0F0F0;
            --main-text-color: #F0F0F0;
            --card-bg-gradient: linear-gradient(139deg, #34373d, #222429 100%);
            --main-font: "Cascadia Mono", sans-serif;
        }
        body {
            background-color: var(--page-bg-color);
            color: var(--main-text-color);
            font-family: var(--main-font);
            padding: 20px;
        }

        .std-info-container, pre, input, button, select {
            font-family: var(--main-font) !important;
            font-size: 14px;
        }

        .std-info-container {
            background: var(--card-bg-gradient);
            border-radius: 10px 30px 10px 10px;
            padding: 28px;
            border: 1px solid #C5C5C5;
            width: 600px;
            margin: 50px auto;
        }
        pre {
            background: rgba(255,255,255,0.5);
            padding: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #C5C5C5;

            border-radius: 13px;

            margin-top: 1px;
        }

        .info-h {
            color: var(--main-text-color);
            font-style: italic;
            font-weight: 500;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        
        input[type="text"], select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #999;
            background: rgb(231, 232, 235);
        }

        label {
            padding-bottom: 3px;
            display: inline-block;
        }

        button {
            padding: 4px;
            background-color: #26252C;
            border-color: #26252C;
            color: #e4e4e4;
            border-radius: 5px;
            transition: all 200ms ease;
        }

        button:hover {
            background-color: #363542;
            border-color: #afadbb;
        }
    </style>
</head>
<body>
    <!-- Write a program that takes a JSON file and a filter value as input -->
    <div class="std-info-container" id="container">        

        <!-- https://developer.mozilla.org/en-US/docs/Web/API/FileReader -->
        <div>
            <label class="info-h" for="file-input">Input your .json file:</label>
            <input type="file" id="file-input" />
        </div>

        <div class="filter-group">
            <div>
                <label class="info-h">Key:</label><br>
                <select id="key-select">
                    <option value="">Select key...</option>
                </select>
            </div>
            <div>
                <label class="info-h">Value:</label><br>
                <input type="text" id="filter-input" placeholder="Value to match..." />
            </div>
            <div style="align-self: flex-end;">
                <button id="apply-btn">Apply filter</button>
            </div>
        </div>

        <div id="message" style="margin-top: 10px; font-weight: bold;"></div>
        
        <p class="info-h">Original content:</p>
        <pre id="file-content"></pre>

        <p class="info-h">Available keys and values:</p>
        <pre id="json-keys"></pre>

        <p class="info-h">Filtration result:</p>
        <pre id="filtered-content"></pre>
    </div>

    <!-- Output the filtered JSON data-->
    <script>
        const fileInput = document.getElementById("file-input");
        const keySelect = document.getElementById("key-select");
        const filterInput = document.getElementById("filter-input");
        const applyBtn = document.getElementById("apply-btn");

        const fileContentDisplay = document.getElementById("file-content");
        const jsonKeysDisplay = document.getElementById("json-keys");
        const filteredContentDisplay = document.getElementById("filtered-content");
        const messageDisplay = document.getElementById("message");

        let loadedData = null;

        fileInput.addEventListener("change", handleFileSelection);
        applyBtn.addEventListener("click", applyJsonFilter);

        function filterJson(dataArray, filterKey, filterValue) {
            // https://css.in.ua/js/object/Array/method/filter
            let filtered = dataArray.filter(item => {
                return String(item[filterKey]) === filterValue;
            });
            
            return JSON.stringify(filtered, null, 4);
        }

        function applyJsonFilter() {
            if (!loadedData) {
                showMessage("First, download the file", "error");
                return;
            }

            const key = keySelect.value;
            const val = filterInput.value;

            if (!key) {
                showMessage("Please select a key", "error");
                return;
            }
            if (!val) {
                showMessage("Enter a value for filtering", "error");
                return;
            }

            let result = filterJson(loadedData, key, val);
            filteredContentDisplay.textContent = result;
            
            const count = JSON.parse(result).length;
            showMessage(`Filtering applied. Found ${count} items.`, "success");
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];

            fileContentDisplay.textContent = "";
            jsonKeysDisplay.textContent = "";
            filteredContentDisplay.textContent = "";
            messageDisplay.textContent = "";
            keySelect.innerHTML = '<option value="">Select key...</option>';

            if (!file) return;

            if (file.type !== "application/json" && !file.name.endsWith(".json")) {
                showMessage("Please select a .json file", "error");
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    let rawString = reader.result;
                    fileContentDisplay.textContent = rawString;
                    
                    loadedData = JSON.parse(rawString);

                    let dataArray = Array.isArray(loadedData) ? loadedData : [loadedData];
                    
                    if (dataArray.length > 0) {
                        let keys = Object.keys(dataArray[0]);
                        
                        let keysDisplayString = "";
                        keys.forEach(k => {

                            const option = document.createElement("option");
                            option.value = k;
                            option.textContent = k;
                            keySelect.appendChild(option);

                            let uniqueVals = [...new Set(dataArray.map(item => item[k]))];
                            keysDisplayString += `${k}: [${uniqueVals.join(", ")}]\n`;
                        });

                        jsonKeysDisplay.textContent = keysDisplayString;
                        showMessage("File successfully read", "success");
                    }

                } catch (e) {
                    showMessage("JSON parsing error", "error");
                }
            };
            reader.readAsText(file);
        }

        function showMessage(message, type) {
            messageDisplay.textContent = message;
            messageDisplay.style.color = type === "error" ? "#d93025" : "#188038";
        }
    </script>
</body>
</html>
